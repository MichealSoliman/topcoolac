<!DOCTYPE html>
<html lang="ar">
<head>
<link rel="icon" type="image/webp" href="/assets/img/logo.webp">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - الصفحة غير موجودة | TopCoolAC</title>
  <!-- خطوط حديثة وجذابة من Google Fonts -->
  <link rel="stylesheet" href="/assets/css/fonts.css">
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0f1828; /* اللون الأساسي */
      color: #f59e0b; /* اللون الثاني */
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1.5rem;
      direction: rtl; /* دعم اللغة العربية */
    }

    .error-container {
      max-width: 750px;
      width: 100%;
      padding: 2.5rem 1.8rem;
      background: rgba(15, 24, 40, 0.85);
      backdrop-filter: blur(3px);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 48px 48px 48px 48px;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(245, 158, 11, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .error-container:hover {
      transform: scale(1.01);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9), 0 0 0 2px #f59e0b55;
    }

    /* رقم 404 الضخم مع لمسة ذهبية */
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      color: #f59e0b;
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.4), 0 8px 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 8px;
      margin-bottom: 0.25rem;
      position: relative;
      display: inline-block;
    }

    .error-code span {
      display: inline-block;
      transition: 0.3s;
    }

    .error-code span:hover {
      transform: translateY(-8px) scale(1.02);
      text-shadow: 0 0 35px #f59e0b, 0 10px 30px #0f1828;
    }

    /* أيقونة أو رمز (اختياري) */
    .error-icon {
      font-size: 3.8rem;
      margin-bottom: 0.25rem;
      display: block;
      color: #f59e0b;
      opacity: 0.8;
      filter: drop-shadow(0 4px 10px rgba(245, 158, 11, 0.3));
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0.5rem 0 0.25rem;
      color: #ffffff;
      letter-spacing: 1px;
      border-bottom: 2px dashed #f59e0b55;
      display: inline-block;
      padding-bottom: 0.3rem;
    }

    .sub-message {
      font-size: 1.2rem;
      font-weight: 400;
      color: #d1d5db;
      margin: 1.2rem 0 1.8rem;
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #f59e0b20;
    }

    .sub-message strong {
      color: #f59e0b;
      font-weight: 700;
    }

    .btn-home {
      display: inline-block;
      background: transparent;
      color: #f59e0b;
      font-family: 'Cairo', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      text-decoration: none;
      border: 2px solid #f59e0b;
      transition: 0.25s ease;
      letter-spacing: 0.5px;
      backdrop-filter: blur(2px);
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.1);
    }

    .btn-home:hover {
      background: #f59e0b;
      color: #0f1828;
      box-shadow: 0 10px 30px -6px #f59e0b, 0 0 0 1px #f59e0b;
      transform: translateY(-4px);
    }

    .btn-home i {
      margin-left: 8px;
      display: inline-block;
    }

    /* روابط مساعدة إضافية */
    .help-links {
      margin-top: 2.2rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.8rem;
    }

    .help-links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.2s;
      border-bottom: 1px dotted transparent;
      padding-bottom: 2px;
    }

    .help-links a:hover {
      color: #f59e0b;
      border-bottom-color: #f59e0b;
    }

    /* خط فاصل أنيق */
    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
      margin: 0.8rem auto 1.2rem;
      border-radius: 10px;
      opacity: 0.5;
    }

    /* تلميحات للجوال */
    @media (max-width: 580px) {
      .error-code {
        font-size: 5.8rem;
        letter-spacing: 4px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .sub-message {
        font-size: 1rem;
        padding: 0.6rem 1rem;
      }
      .btn-home {
        font-size: 1.1rem;
        padding: 0.7rem 2rem;
      }
      .error-container {
        padding: 1.8rem 0.8rem;
        border-radius: 32px;
      }
    }

    @media (max-width: 400px) {
      .error-code {
        font-size: 4.5rem;
      }
      .help-links {
        flex-direction: column;
        gap: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">

    <!-- أيقونة رمزية (يمكنك تغييرها) -->
    <div class="error-icon">❄️</div>

    <!-- الرقم 404 مع تأثير ذهبي -->
    <div class="error-code">
      <span>4</span><span>0</span><span>4</span>
    </div>

    <div class="divider"></div>

    <h1>⚠️ الصفحة غير موجودة</h1>

    <div class="sub-message">
      يبدو أنك ضللت الطريق في <strong> TopCoolAC </strong> <br>
      ربما تم نقل الصفحة أو حذفها أو أن الرابط غير صحيح.
    </div>

    <!-- زر العودة للرئيسية -->
    <a href="https://topcoolac.com/" class="btn-home">
      🏠 العودة للرئيسية
    </a>

    <!-- روابط مساعدة سريعة -->
    <div class="help-links">
      <a href="https://topcoolac.com/">الصفحة الرئيسية</a>
    </div>

    <!-- تذيير بسيط مع اللون الثاني -->
    <div style="margin-top: 2rem; font-size: 0.85rem; color: #6b7280; border-top: 1px solid #f59e0b15; padding-top: 1.2rem; letter-spacing: 0.3px;">
      <span style="color: #f59e0b;">✦</span> TopCoolAC <span style="color: #f59e0b;">✦</span> 
      <span style="color: #9ca3af; margin: 0 6px;">|</span> 
      <span style="color: #d1d5db;">تبريد احترافي</span>
    </div>
  </div>
</body>
</html>
